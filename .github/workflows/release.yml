name: Build and Publish Python Package

on:
  # Only build/publish for release tags -- no builds on ordinary branch pushes.
  push:
    tags:
    - "v*"
  # Lets the build be exercised without inventing a tag. The publish job stays
  # gated on being the upstream repo, so a manual run only ever builds.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.baipp.outputs.package_name }}
      version: ${{ steps.baipp.outputs.package_version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    # v3.0.0 ships Twine 7, which understands packaging metadata 2.5. The
    # pinned v2.18.0 carried an older Twine whose `twine check --strict` failed
    # with "'2.5' is not a valid metadata version" once hatchling started
    # emitting it. Upstream no longer force-tags @v3/@v3.0, so pin the exact
    # version and hash.
    - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
      id: baipp

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only the upstream repo publishes. This fork builds under the
    # `meltanolabs-tap-github` name, which it does not own on PyPI, and its
    # tags carry a PEP 440 local version (`+xflow.N`) that PyPI rejects
    # outright -- so a publish from here could only ever fail or, worse,
    # succeed against someone else's package.
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'MeltanoLabs/tap-github'
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: Packages
        path: dist
    - name: Deploy to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
