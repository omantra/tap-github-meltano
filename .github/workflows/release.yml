name: Build and Publish Python Package

on:
  # Only build/publish for release tags -- no builds on ordinary branch pushes.
  push:
    tags:
    - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.baipp.outputs.package_name }}
      version: ${{ steps.baipp.outputs.package_version }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    - uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df # v2.18.0
      id: baipp

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only the upstream repo publishes. This fork builds under the
    # `meltanolabs-tap-github` name, which it does not own on PyPI, and its
    # tags carry a PEP 440 local version (`+xflow.N`) that PyPI rejects
    # outright -- so a publish from here could only ever fail or, worse,
    # succeed against someone else's package.
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'MeltanoLabs/tap-github'
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: Packages
        path: dist
    - name: Deploy to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
