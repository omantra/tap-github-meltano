name: CI

on:
  # Run on all pull requests and on pushes to main / xflow_dev.
  pull_request:
    paths:
    - .github/workflows/ci.yml
    - pyproject.toml
    - uv.lock
    - tap_github/**
    - tests/**
  push:
    branches:
      - main
      - xflow_dev
    paths:
    - .github/workflows/ci.yml
    - pyproject.toml
    - uv.lock
    - tap_github/**
    - tests/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  tests:
    name: CI

    # A same-repo PR fires both `push` and `pull_request`, and the two events
    # have different `github.ref` values, so the concurrency group above cannot
    # dedupe them. Skip the `pull_request` run only when a `push` run already
    # covered that commit -- which is true just for the branches listed in the
    # push trigger. Everything else runs: fork PRs (no push event here) and
    # same-repo PRs from any other branch, `dependabot/*` and feature branches
    # included. Keep this list in step with the push `branches:` above.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["main", "xflow_dev"]'), github.event.pull_request.head.ref)

    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      ORG_LEVEL_TOKEN: ${{secrets.ORG_LEVEL_TOKEN}}
      TOX_GH_MAJOR_MINOR: ${{ matrix.python-version }}
      # Point the live tests at this repo rather than upstream's. It is small
      # (so the per-issue/per-PR child streams barely fan out) and the default
      # `secrets.GITHUB_TOKEN` can read it, being the repo the job runs in.
      TAP_GITHUB_TEST_REPOS: ${{ github.repository }}
      # NB: the pagination caps in tests/conftest.py are deliberately NOT set
      # here. Measured cold-cache cost with per_page=5/max_results=15 was 1512
      # requests against ~1600 uncapped -- a ~6% saving -- because the cost is
      # dominated by child streams fetching per parent record, not by page
      # depth. They also fail `test_get_a_user_in_user_usernames_mode`, which
      # asserts >150 records to prove deep pagination, so no cap can both save
      # requests and satisfy it.
    strategy:
      matrix:
        python-version:
        - "3.13"
        - "3.12"
      # run the matrix jobs one after the other so they can benefit from caching

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Get Date
      id: get-date
      run: |
        echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache github API responses
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # must match the path in tests/__init__.py
        path: '.cache/api_calls_tests_cache.sqlite'
        # github cache expires after 1wk, and we expire the content after 24h
        # this key is rotated every 24h so that the code does not find a stale
        # file in the cache. See issue #119
        key: api-cache-v4-${{ steps.get-date.outputs.date }}

    - name: Install uv
      uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Tox
      run: |
        uv tool install --with tox-gh tox

    - name: Run Tox
      id: test_pytest
      continue-on-error: true
      env:
        LOGLEVEL: WARNING
      run: |
        tox

    - name: Run Tox (run 2)
      id: retry_test_pytest
      if: steps.test_pytest.outcome=='failure'         # check the step outcome, wait and retry
      env:
        LOGLEVEL: WARNING
      run: |
        # sleep as little as possible to reduce CI run time
        # This assumes that REST quota is the one that caused problem
        # (which is most likely/often the case)
        target_ts=$(curl -s -H "Accept: application/vnd.github+json"  -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28"  https://api.github.com/rate_limit | grep reset | head -n 1 | awk -F: '{ print $2 }')
        current_ts=$(date +%s)
        seconds_to_sleep=$(echo "$target_ts - $current_ts" | bc)
        sleep $seconds_to_sleep
        tox
